services:
  app:
    build: .
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      DB_PATH: /data/usage.db
      LOG_DIRS: claude-code=/logs/claude,codex=/logs/codex,pi=/logs/pi
    volumes:
      - usage-data:/data
      # エージェントCLIのセッションログは読み取り専用でマウントする
      - ${CLAUDE_LOG_DIR:-./logs/claude}:/logs/claude:ro
      - ${CODEX_LOG_DIR:-./logs/codex}:/logs/codex:ro
      - ${PI_LOG_DIR:-./logs/pi}:/logs/pi:ro
    tmpfs:
      - /tmp
    expose:
      - "8000"
    # ports は公開しない。外部公開は cloudflared 経由のみ。

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - app
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  usage-data:
