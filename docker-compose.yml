services:
  app:
    restart: always
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
        # 稼働バージョンとして /v1/admin/status に出す。通常は updater が
        # ビルド時に自動で埋めるため、手動ビルド時だけ指定すればよい
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      DB_PATH: /data/usage.db
      LOG_DIRS: "${LOG_DIRS-claude-code=/logs/claude,codex=/logs/codex,pi=/logs/pi}"
      # パス配下で公開する場合のみ設定する（例: /usage）。サブドメインの
      # ルートで公開する場合は空のまま。未設定でもアプリが自動検出する
      APP_BASE_PATH: "${APP_BASE_PATH:-}"
      # updater サイドカーとの制御ファイル受け渡し用
      CONTROL_DIR: /control
    volumes:
      - usage-data:/data
      - control:/control
      # エージェントCLIのセッションログは読み取り専用でマウントする
      - ${CLAUDE_LOG_DIR:-./logs/claude}:/logs/claude:ro
      - ${CODEX_LOG_DIR:-./logs/codex}:/logs/codex:ro
      - ${PI_LOG_DIR:-./logs/pi}:/logs/pi:ro
    tmpfs:
      - /tmp
    expose:
      - "8000"
    # ports は公開しない。外部公開は cloudflared 経由のみ。

  cloudflared:
    restart: always
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - app
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # セルフアップデートの実行役。docker.sock を持つのはこのコンテナだけ。
  # ネットワークの受付はせず、アプリが control ボリュームに書いた
  # 更新リクエスト（固定手順のみ）を実行する。
  # ソースはホストのチェックアウトではなく、専用ボリューム source 内の
  # 自前クローン（/src/repo）を使う。ホスト側の git 状態に干渉されない。
  updater:
    restart: always
    build:
      context: ./updater
    environment:
      CONTROL_DIR: /control
      PROJECT_DIR: /src/repo
      APP_HEALTH_URL: http://app:8000/healthz
      # 動作確認用。1 のときは git / docker を実行せず成功扱いで状態だけ進める
      UPDATER_DRY_RUN: "${UPDATER_DRY_RUN:-}"
      # 自前クローンの取得元（公開リポジトリ。未指定なら公式 URL）
      GIT_REPO_URL: "${GIT_REPO_URL:-}"
    volumes:
      - control:/control
      - source:/src
      # compose の interpolation と app の env_file 用に、ホストの .env を
      # クローン直下へそのまま見せる
      - ./.env:/src/repo/.env:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - app

volumes:
  usage-data:
  control:
  source:
