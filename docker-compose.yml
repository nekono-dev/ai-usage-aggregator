services:
  app:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
        # 稼働バージョンとして /v1/admin/status に出す。通常は updater が
        # ビルド時に自動で埋めるため、手動ビルド時だけ指定すればよい
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      DB_PATH: /data/usage.db
      LOG_DIRS: "${LOG_DIRS-claude-code=/logs/claude,codex=/logs/codex,pi=/logs/pi}"
      # パス配下で公開する場合のみ設定する（例: /usage）。サブドメインの
      # ルートで公開する場合は空のまま。未設定でもアプリが自動検出する
      APP_BASE_PATH: "${APP_BASE_PATH:-}"
      # updater サイドカーとの制御ファイル受け渡し用
      CONTROL_DIR: /control
    volumes:
      - usage-data:/data
      - control:/control
      # エージェントCLIのセッションログは読み取り専用でマウントする
      - ${CLAUDE_LOG_DIR:-./logs/claude}:/logs/claude:ro
      - ${CODEX_LOG_DIR:-./logs/codex}:/logs/codex:ro
      - ${PI_LOG_DIR:-./logs/pi}:/logs/pi:ro
    tmpfs:
      - /tmp
    expose:
      - "8000"
    # ports は公開しない。外部公開は cloudflared 経由のみ。

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - app
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # セルフアップデートの実行役。docker.sock を持つのはこのコンテナだけ。
  # ネットワークの受付はせず、アプリが control ボリュームに書いた
  # 更新リクエスト（固定手順のみ）を実行する。
  updater:
    build:
      context: ./updater
    environment:
      CONTROL_DIR: /control
      PROJECT_DIR: /project
      APP_HEALTH_URL: http://app:8000/healthz
      # 動作確認用。1 のときは git / docker を実行せず成功扱いで状態だけ進める
      UPDATER_DRY_RUN: "${UPDATER_DRY_RUN:-}"
      # git の SSH 接続をホストの実行ユーザーと同じ設定で行うための指定。
      # ~/.ssh 内の config（Host エイリアス等）と鍵を、そのままのパスで参照する
      HOME: "${HOME}"
      GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known_hosts"
    volumes:
      - control:/control
      # デプロイ用チェックアウトそのものをマウントする（git pull の対象）
      - .:/project
      - /var/run/docker.sock:/var/run/docker.sock
      # SSH リモートから fetch するため、実行ユーザーの ~/.ssh を
      # 読み取り専用・同一パスでマウントする（config と鍵）
      - ${HOME}/.ssh:${HOME}/.ssh:ro
    depends_on:
      - app

volumes:
  usage-data:
  control:
